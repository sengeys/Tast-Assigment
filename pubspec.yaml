name: task_assignment
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Package ដែល App ប្រើ ត្រូវនៅក្នុង dependencies (មិនមែន dev_dependencies)
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: ^0.20.3
  provider: ^6.1.2
  flutter_local_notifications: ^23.0.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/noto-sans-khmer/static/
  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/noto-sans-khmer/static/NotoSansKhmer-Regular.ttf
        - asset: assets/fonts/noto-sans-khmer/static/NotoSansKhmer-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"